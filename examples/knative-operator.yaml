{
  "components": {
    "knativeOperator": {
      "enabled": true
    }
  },
  "knativeOperator": {
    "knative_operator": {
      "knative_operator": {
        "affinity": {
          "nodeAffinity": {
            "requiredDuringSchedulingIgnoredDuringExecution": {
              "nodeSelectorTerms": [
                {
                  "matchExpressions": [
                    {
                      "key": "kubernetes.io/arch",
                      "operator": "In",
                      "values": [
                        "arm64"
                      ]
                    }
                  ]
                }
              ]
            }
          }
        }
      },
      "operator_webhook": {
        "affinity": {
          "nodeAffinity": {
            "requiredDuringSchedulingIgnoredDuringExecution": {
              "nodeSelectorTerms": [
                {
                  "matchExpressions": [
                    {
                      "key": "kubernetes.io/arch",
                      "operator": "In",
                      "values": [
                        "arm64"
                      ]
                    }
                  ]
                }
              ]
            }
          }
        }
      }
    }
  }
}
